name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  test-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Test API endpoints
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: |
          npm run dev &
          sleep 12

          echo "=== Health Check ==="
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "$HEALTH"
          echo "$HEALTH" | grep -q '"status":"healthy"' && echo "PASS: Health" || { echo "FAIL: Health"; exit 1; }

          echo "=== Login ==="
          curl -s -c cookies.txt -b cookies.txt -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"babuji2024"}' > login.json
          cat login.json
          grep -q '"success":true' login.json && echo "PASS: Login" || { echo "FAIL: Login"; exit 1; }

          echo "=== Session ==="
          curl -s -b cookies.txt http://localhost:3000/api/auth/session > session.json
          cat session.json
          grep -q '"loggedIn":true' session.json && echo "PASS: Session" || { echo "FAIL: Session"; exit 1; }

          echo "=== Products ==="
          curl -s -b cookies.txt http://localhost:3000/api/products > products.json
          grep -q '"products"' products.json && echo "PASS: Products" || { echo "FAIL: Products"; exit 1; }

          echo "=== Today's Menu ==="
          curl -s -b cookies.txt http://localhost:3000/api/todays-menu > menu.json
          grep -q '"todays_menu"' menu.json && echo "PASS: TodaysMenu" || { echo "FAIL: TodaysMenu"; exit 1; }

          echo "=== Summary ==="
          curl -s -b cookies.txt http://localhost:3000/api/summary > summary.json
          grep -q '"summary"' summary.json && echo "PASS: Summary" || { echo "FAIL: Summary"; exit 1; }

          echo "=== Create Transaction ==="
          curl -s -b cookies.txt -X POST http://localhost:3000/api/transactions \
            -H "Content-Type: application/json" \
            -d '{"total_amount":100,"discount":0,"cash_paid":100,"upi_paid":0,"items":[{"product_id":1,"quantity":2,"unit_price":50}]}' > txn.json
          cat txn.json
          grep -q '"sale"' txn.json && echo "PASS: Transaction" || { echo "FAIL: Transaction"; exit 1; }

          echo "=== Offers ==="
          curl -s -b cookies.txt http://localhost:3000/api/offers > offers.json
          grep -q '"offers"' offers.json && echo "PASS: Offers" || { echo "FAIL: Offers"; exit 1; }

          echo "=== Special Numbers ==="
          curl -s -b cookies.txt http://localhost:3000/api/special-numbers > special.json
          grep -q '"special_numbers"' special.json && echo "PASS: SpecialNumbers" || { echo "FAIL: SpecialNumbers"; exit 1; }

          echo "=== Profile ==="
          curl -s -b cookies.txt http://localhost:3000/api/profile > profile.json
          grep -q '"profile"' profile.json && echo "PASS: Profile" || { echo "FAIL: Profile"; exit 1; }

          echo ""
          echo "ALL TESTS PASSED"
          kill %1 2>/dev/null || true
