name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}

      - name: Build
        run: npm run build
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}

  test-api:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Start dev server
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: npm run dev &

      - name: Wait for server
        run: |
          for i in $(seq 1 20); do
            curl -s http://localhost:3000/api/health > /dev/null 2>&1 && break
            sleep 2
          done

      - name: Test health endpoint
        run: |
          HEALTH=$(curl -s http://localhost:3000/api/health)
          echo "Health: $HEALTH"
          echo "$HEALTH" | grep -q '"checks"' && echo "PASS: Health endpoint responds" || { echo "FAIL: Health endpoint not responding"; exit 1; }

      - name: Test login
        run: |
          LOGIN=$(curl -s -c cookies.txt -b cookies.txt -X POST http://localhost:3000/api/auth/login \
            -H "Content-Type: application/json" \
            -d '{"username":"admin","password":"babuji2024"}')
          echo "Login: $LOGIN"
          echo "$LOGIN" | grep -q '"success":true' && echo "PASS: Login" || { echo "FAIL: Login"; exit 1; }

      - name: Test session
        run: |
          SESSION=$(curl -s -b cookies.txt http://localhost:3000/api/auth/session)
          echo "Session: $SESSION"
          echo "$SESSION" | grep -q '"authenticated":true' && echo "PASS: Session" || { echo "FAIL: Session"; exit 1; }

      - name: Test products (DB required)
        run: |
          PRODUCTS=$(curl -s -b cookies.txt http://localhost:3000/api/products)
          echo "Products: $(echo $PRODUCTS | head -c 200)"
          echo "$PRODUCTS" | grep -q '"products"' && echo "PASS: Products" || echo "WARN: Products (DB may be unreachable from CI)"

      - name: Test todays-menu (DB required)
        run: |
          MENU=$(curl -s -b cookies.txt http://localhost:3000/api/todays-menu)
          echo "Menu: $(echo $MENU | head -c 200)"
          echo "$MENU" | grep -q '"todays_menu"' && echo "PASS: TodaysMenu" || echo "WARN: TodaysMenu (DB may be unreachable from CI)"

      - name: Test offers (DB required)
        run: |
          OFFERS=$(curl -s -b cookies.txt http://localhost:3000/api/offers)
          echo "Offers: $(echo $OFFERS | head -c 200)"
          echo "$OFFERS" | grep -q '"offers"' && echo "PASS: Offers" || echo "WARN: Offers (DB may be unreachable from CI)"

      - name: Test profile (DB required)
        run: |
          PROFILE=$(curl -s -b cookies.txt http://localhost:3000/api/profile)
          echo "Profile: $(echo $PROFILE | head -c 200)"
          echo "$PROFILE" | grep -q '"profile"' && echo "PASS: Profile" || echo "WARN: Profile (DB may be unreachable from CI)"

      - name: Test transaction (DB required)
        run: |
          TXN=$(curl -s -b cookies.txt -X POST http://localhost:3000/api/transactions \
            -H "Content-Type: application/json" \
            -d '{"total_amount":100,"discount":0,"cash_paid":100,"upi_paid":0,"items":[{"product_id":1,"quantity":2,"unit_price":50}]}')
          echo "Transaction: $(echo $TXN | head -c 200)"
          echo "$TXN" | grep -q '"sale"' && echo "PASS: Transaction" || echo "WARN: Transaction (DB may be unreachable from CI)"

      - name: Kill server
        if: always()
        run: kill $(lsof -t -i:3000) 2>/dev/null || true
